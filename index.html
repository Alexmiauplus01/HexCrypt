window.__bootErr = [];
window.addEventListener('error', function (e) { if (!window.__booted) { window.__bootErr.push((e.message || 'error') + (e.filename ? ' (' + e.filename.split('/').pop().split('?')[0] + ')' : '')); bootProblem(); } });

function bootProblem() {
  var ld = document.getElementById('loading'); if (!ld || ld.dataset.problem) return; ld.dataset.problem = '1';

  ld.style.flexDirection = 'column'; ld.style.zIndex = 9;
  document.getElementById('bootfix').onclick = function () {
    var p = [];
    if (navigator.serviceWorker) p.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
    if (window.caches) p.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
    Promise.all(p).catch(function () {}).then(function () { location.replace(location.pathname + '?r=' + Date.now()); });
  };
}
